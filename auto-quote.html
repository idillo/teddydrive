<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Compare Auto Insurance Options | TeddyDrive</title>
  <meta name="description" content="Answer a few questions to review auto insurance options from participating licensed insurance providers.">
  <meta name="robots" content="noindex,follow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/output.css">
</head>
<body class="min-h-screen overflow-x-hidden bg-[#f4f8fb] text-slate-900 antialiased" style="font-family:'Manrope',sans-serif">
  <div class="flex min-h-[100svh] flex-col">
    <header class="border-b border-slate-200 bg-white">
      <div class="mx-auto grid h-14 max-w-7xl grid-cols-[1fr_auto] items-center px-4 sm:grid-cols-3 sm:px-6">
        <a href="/" aria-label="TeddyDrive home"><img src="/assets/teddydrive-logo.png" alt="TeddyDrive" class="h-10 w-auto"></a>
        <div id="route-current-label" class="hidden text-center text-xs font-extrabold uppercase tracking-[.18em] text-teddyNavy sm:block">Vehicle 01</div>
        <div class="text-right text-xs font-bold text-slate-500">About 2 minutes</div>
      </div>
      <div class="h-1 bg-teddyOrange"></div>
    </header>

    <nav class="border-b border-slate-200 bg-white" aria-label="Quote progress">
      <div class="relative mx-auto grid h-14 max-w-5xl grid-cols-4 items-center px-4 sm:h-16">
        <div class="absolute left-[12.5%] right-[12.5%] top-[21px] h-0.5 bg-slate-200 sm:top-[25px]" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-bar" class="h-full bg-teddyBlue transition-all duration-500" style="width:0%"></div>
        </div>
        <div data-route-step="vehicle" class="relative z-10 text-center"><span class="route-dot mx-auto block h-3 w-3 rounded-full bg-teddyOrange ring-4 ring-orange-100"></span><span class="route-label mt-2 block text-[9px] font-extrabold uppercase tracking-wider text-teddyNavy sm:text-xs">Vehicle</span></div>
        <div data-route-step="coverage" class="relative z-10 text-center"><span class="route-dot mx-auto block h-3 w-3 rounded-full bg-slate-300 ring-4 ring-white"></span><span class="route-label mt-2 block text-[9px] font-extrabold uppercase tracking-wider text-slate-400 sm:text-xs">Coverage</span></div>
        <div data-route-step="driver" class="relative z-10 text-center"><span class="route-dot mx-auto block h-3 w-3 rounded-full bg-slate-300 ring-4 ring-white"></span><span class="route-label mt-2 block text-[9px] font-extrabold uppercase tracking-wider text-slate-400 sm:text-xs">Driver</span></div>
        <div data-route-step="contact" class="relative z-10 text-center"><span class="route-dot mx-auto block h-3 w-3 rounded-full bg-slate-300 ring-4 ring-white"></span><span class="route-label mt-2 block text-[9px] font-extrabold uppercase tracking-wider text-slate-400 sm:text-xs">Contact</span></div>
      </div>
    </nav>

    <main class="relative flex min-h-0 w-full flex-1 flex-col overflow-hidden px-4 sm:px-6">
      <div aria-hidden="true" class="pointer-events-none absolute -bottom-24 -right-24 h-64 w-[42rem] rotate-[-12deg] bg-teddyNavy opacity-[.035]"></div>
      <div aria-hidden="true" class="pointer-events-none absolute -bottom-12 right-10 h-2 w-56 rotate-[-12deg] bg-teddyOrange opacity-40"></div>
      <section class="relative mx-auto flex min-h-0 w-full max-w-6xl flex-1 flex-col">
        <div class="absolute left-0 top-2 z-20 sm:top-3">
          <button id="back-button" type="button" class="invisible inline-flex min-h-9 items-center gap-1 px-1 text-sm font-extrabold uppercase tracking-wide text-teddyBlue hover:text-teddyNavy focus-visible:outline-none focus-visible:ring-4 focus-visible:ring-blue-100">← Back</button>
          <span class="hidden"><span id="step-counter">1</span><span id="step-total">1</span></span>
        </div>

        <form id="quote-form" class="flex min-h-0 flex-1 flex-col justify-center py-12 sm:py-14" novalidate>
          <input type="hidden" name="lead_source" value="teddydrive_auto_quote">
          <input type="hidden" name="landing_page" value="auto-quote">
          <input type="hidden" name="consent_timestamp" id="consent_timestamp">
          <input type="hidden" name="consent_text" id="consent_text">
          <input type="hidden" name="xxTrustedFormCertUrl" id="xxTrustedFormCertUrl">
          <input type="hidden" name="Jornaya_LeadID" id="Jornaya_LeadID">
          <input type="text" name="company_website" class="hidden" tabindex="-1" autocomplete="off" aria-hidden="true">
          <div id="question-stage" aria-live="polite"></div>
        </form>

        <div id="success-panel" class="hidden flex-1 place-items-center px-6 py-10 text-center">
          <div>
            <div class="mx-auto grid h-20 w-20 place-items-center rounded-full bg-emerald-100 text-4xl font-black text-emerald-700">✓</div>
            <h1 class="mt-6 text-3xl font-black text-teddyNavy sm:text-4xl">Your request is on its way</h1>
            <p class="mx-auto mt-3 max-w-lg text-lg leading-7 text-slate-600">A participating licensed insurance agent or provider may contact you about available coverage options.</p>
          </div>
        </div>
      </section>

    </main>

    <footer class="border-t border-slate-200 bg-white px-3 py-1.5 text-center text-[9px] leading-4 text-slate-500 sm:text-[10px]">
      © 2026 Idillo Inc. · <a href="/terms.html" class="hover:text-teddyBlue">Terms &amp; Disclosures</a> · <a href="/privacy.html" class="hover:text-teddyBlue">Privacy Policy</a> · <a href="/privacy.html#do-not-sell" class="hover:text-teddyBlue">Do Not Sell My Info</a>
    </footer>
  </div>

  <script>
  (() => {
    const ENDPOINT = '/api/auto-quote';
    const form = document.getElementById('quote-form');
    const stage = document.getElementById('question-stage');
    const backButton = document.getElementById('back-button');
    const progressBar = document.getElementById('progress-bar');
    const routeCurrentLabel = document.getElementById('route-current-label');
    const routeSteps = [...document.querySelectorAll('[data-route-step]')];
    const stepCounter = document.getElementById('step-counter');
    const answers = {};
    const history = [];
    let index = 0;

    const iconUrl = slug => `https://cdn.simpleicons.org/${slug}`;
    const makes = [
      ['Toyota','toyota'],['Ford','ford'],['Chevrolet','chevrolet'],['Honda','honda'],
      ['Nissan','nissan'],['Hyundai','hyundai'],['Kia','kia'],['Jeep','jeep'],
      ['Ram','ram'],['GMC','gmc'],['Subaru','subaru'],['Tesla','tesla'],['Other','']
    ];
    const carriers = [
      ['State Farm','statefarm'],['GEICO','geico'],['Progressive','progressive'],
      ['Allstate','allstate'],['USAA','usaa'],['Liberty Mutual','libertymutual'],
      ['Nationwide','nationwide'],['Farmers','farmersinsurance'],['Other','']
    ];
    const years = Array.from({length: 31}, (_, i) => String(new Date().getFullYear() + 1 - i));
    const models = {
      Toyota:['Camry','Corolla','RAV4','Highlander','Tacoma','Tundra','Prius','Sienna','4Runner','Other'],
      Ford:['F-150','Escape','Explorer','Edge','Fusion','Mustang','Bronco','Ranger','Expedition','Other'],
      Chevrolet:['Silverado','Equinox','Malibu','Traverse','Tahoe','Suburban','Trailblazer','Colorado','Impala','Other'],
      Honda:['Civic','Accord','CR-V','Pilot','Odyssey','HR-V','Ridgeline','Passport','Other'],
      Nissan:['Altima','Rogue','Sentra','Pathfinder','Murano','Frontier','Titan','Versa','Maxima','Other'],
      Hyundai:['Tucson','Elantra','Santa Fe','Sonata','Palisade','Kona','Venue','Accent','Other'],
      Kia:['Forte','K5 / Optima','Sportage','Sorento','Soul','Telluride','Rio','Carnival','Other'],
      Jeep:['Wrangler','Grand Cherokee','Cherokee','Compass','Renegade','Gladiator','Wagoneer','Other'],
      Ram:['1500','2500','3500','ProMaster','Other'],
      GMC:['Sierra','Terrain','Acadia','Yukon','Canyon','Savana','Other'],
      Subaru:['Outback','Forester','Crosstrek','Impreza','Legacy','Ascent','WRX','Other'],
      Tesla:['Model 3','Model Y','Model S','Model X','Cybertruck','Other'],
      Other:['Other']
    };

    const steps = [
      { section:'vehicle', key:'has_coverage', type:'choice', title:'Are you currently insured?', choices:['Yes','No'] },
      { section:'vehicle', key:'year', type:'choice', title:"What's the year of your vehicle?", choices:years, grid:'grid-cols-6', scroll:true },
      { section:'vehicle', key:'make', type:'logo', title:"What's the make of your vehicle?", choices:makes },
      { section:'vehicle', key:'model', type:'model', title:`What's the model of your vehicle?` },
      { section:'vehicle', key:'owned_or_leased', type:'choice', title:'How is this vehicle financed?', choices:['Owned','Financed','Leased'], grid:'grid-cols-1 sm:grid-cols-3' },
      { section:'vehicle', key:'use', type:'choice', title:'What is the primary use?', choices:['Commute to work','Pleasure','Business','School'], grid:'grid-cols-2' },
      { section:'vehicle', key:'second_vehicle', type:'choice', title:'Would you like to add a second vehicle?', sub:'Save an additional 20%', choices:['Yes','No'] },
      { section:'vehicle', key:'year_2', type:'choice', title:"What's the year of your second vehicle?", choices:years, grid:'grid-cols-6', scroll:true, when:a => a.second_vehicle === 'Yes' },
      { section:'vehicle', key:'make_2', type:'logo', title:"What's the make of your second vehicle?", choices:makes, when:a => a.second_vehicle === 'Yes' },
      { section:'vehicle', key:'model_2', type:'model', title:"What's the model of your second vehicle?", when:a => a.second_vehicle === 'Yes' },
      { section:'vehicle', key:'owned_or_leased_2', type:'choice', title:'How is your second vehicle financed?', choices:['Owned','Financed','Leased'], grid:'grid-cols-1 sm:grid-cols-3', when:a => a.second_vehicle === 'Yes' },
      { section:'vehicle', key:'use_2', type:'choice', title:'What is the primary use for your second vehicle?', choices:['Commute to work','Pleasure','Business','School'], grid:'grid-cols-2', when:a => a.second_vehicle === 'Yes' },
      { section:'coverage', key:'former_insurer', type:'logo', title:'Who is your current insurance provider?', choices:carriers, when:a => a.has_coverage === 'Yes' },
      { section:'coverage', key:'months_insured', type:'choice', title:'How long have you been continuously insured?', sub:'Five or more years may qualify you for better rates', choices:['Less than 1 year','1–2 years','3–4 years','5+ years'], grid:'grid-cols-2', when:a => a.has_coverage === 'Yes' },
      { section:'driver', key:'gender', type:'choice', title:'What is your gender?', choices:['Male','Female'] },
      { section:'driver', key:'marital_status', type:'choice', title:'What is your marital status?', choices:['Single','Married','Divorced','Separated','Widowed','Domestic partner'], grid:'grid-cols-2 sm:grid-cols-3' },
      { section:'driver', key:'highest_level', type:'choice', title:'What is your highest education level?', choices:['High school','Some college','Associate degree',"Bachelor's degree",'Graduate degree','Other'], grid:'grid-cols-2 sm:grid-cols-3' },
      { section:'driver', key:'occupation', type:'choice', title:'What best describes your occupation?', choices:['Employed','Self-employed','Retired','Student','Homemaker','Unemployed','Other'], grid:'grid-cols-2 sm:grid-cols-3' },
      { section:'driver', key:'credit_rating', type:'choice', title:'How would you estimate your credit?', sub:"Most people select “Good.” This does not affect your credit score.", choices:['Excellent','Good','Average','Poor or fair'], grid:'grid-cols-2' },
      { section:'driver', key:'ticket_count', type:'choice', title:'Tickets in the past three years?', choices:['0','1','2','3+'], grid:'grid-cols-2 sm:grid-cols-4' },
      { section:'driver', key:'license_status', type:'choice', title:'Do you have an active driver’s license?', choices:['Yes','No'] },
      { section:'driver', key:'at_fault_accident', type:'choice', title:'Any at-fault accidents in the past three years?', choices:['Yes','No'] },
      { section:'driver', key:'dui', type:'choice', title:'Any DUI convictions in the past three years?', choices:['Yes','No'] },
      { section:'driver', key:'birthdate', type:'date', title:"What's your date of birth?", validate:v => { const d=new Date(v), now=new Date(); let age=now.getFullYear()-d.getFullYear(); if(now < new Date(now.getFullYear(),d.getMonth(),d.getDate())) age--; return age >= 18 && age <= 100; }, error:'Enter a valid birthdate for a driver age 18 or older.' },
      { section:'driver', key:'own_or_rent', type:'choice', title:'Do you own or rent your home?', choices:['Own','Rent','Other'] },
      { section:'driver', key:'bundle_interest', type:'choice', title:'Would you like to bundle your auto and home insurance policies?', sub:'Drivers who bundle their policies save an average of 20%!', choices:['Yes','No'] },
      { section:'driver', key:'military', type:'choice', title:'Have you or your spouse served in the U.S. military?', choices:['Yes','No'] },
      { section:'contact', key:'name', type:'name', title:"What's your name?", sub:'Your information is secure and used to match available options.' },
      { section:'contact', key:'address', type:'address', title:"What's your current address?" },
      { section:'contact', key:'email', type:'email', title:"What's your email address?", placeholder:'you@example.com', autocomplete:'email' },
      { section:'contact', key:'phone', type:'phone', title:'Where can a licensed agent reach you?', placeholder:'(555) 555-5555', autocomplete:'tel' },
      { section:'contact', key:'review', type:'review', title:'Review your information' }
    ];

    document.getElementById('step-total').textContent = steps.length;

    function activeSteps() { return steps.filter(s => !s.when || s.when(answers)); }
    function esc(value='') { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function heading(step) {
      return `<div class="text-left"><p class="mb-2 text-[10px] font-extrabold uppercase tracking-[.2em] text-teddyOrange">Select one</p><h1 class="max-w-4xl text-3xl uppercase leading-[.98] tracking-[-.025em] text-teddyNavy sm:text-5xl" style="font-family:'Archivo Black',sans-serif">${esc(step.title)}</h1>${step.sub ? `<p class="mt-3 max-w-xl text-sm font-bold leading-6 text-teddyBlue sm:text-base">${esc(step.sub)}</p>` : ''}</div>`;
    }
    function choiceMarkup(step) {
      const grid = step.grid || 'grid-cols-2';
      const binary = step.choices.length === 2 && step.choices[0] === 'Yes' && step.choices[1] === 'No';
      const isYear = step.key === 'year' || step.key === 'year_2';
      if (isYear) return `<div class="mt-5 sm:hidden"><select id="year-select" class="quote-field"><option value="">Select vehicle year</option>${step.choices.map(choice=>`<option ${answers[step.key]===choice?'selected':''}>${choice}</option>`).join('')}</select></div><div class="mt-5 hidden grid-cols-6 gap-2 sm:grid">${step.choices.map(choice => `<button type="button" class="quote-choice min-h-12 py-2 ${answers[step.key]===choice?'selected':''}" data-value="${choice}">${choice}</button>`).join('')}</div>`;
      return `<div class="mt-6 grid w-full ${grid} gap-3 sm:mt-8 sm:max-w-4xl">${step.choices.map(choice => `<button type="button" class="quote-choice ${binary?'binary':''} ${answers[step.key]===choice?'selected':''}" data-value="${esc(choice)}"><span>${esc(choice)}</span></button>`).join('')}</div>`;
    }
    function logoMarkup(step) {
      return `<div class="mt-5 grid grid-cols-2 gap-2 sm:grid-cols-4">${step.choices.map(([label,slug]) => `<button type="button" class="quote-choice min-h-20 flex-col gap-2 bg-white py-3 ${answers[step.key]===label?'selected':''}" data-value="${esc(label)}">${slug?`<img src="${iconUrl(slug)}" alt="" class="h-9 w-24 object-contain" loading="lazy" onerror="this.style.display='none'">`:`<span class="text-2xl text-teddyOrange">•••</span>`}<span class="text-sm">${esc(label)}</span></button>`).join('')}</div>`;
    }
    function modelMarkup(step) {
      const make = answers[step.key === 'model_2' ? 'make_2' : 'make'] || 'Other';
      const choices = models[make] || models.Other;
      return `<div class="mt-6 grid gap-2 sm:max-w-4xl sm:grid-cols-2">${choices.map(model => `<button type="button" class="quote-choice justify-between bg-white px-5 text-left ${answers[step.key]===model?'selected':''}" data-value="${esc(model)}"><span>${esc(model)}</span><span class="text-xl text-teddyBlue">›</span></button>`).join('')}</div>`;
    }
    function fieldMarkup(step, type='text') {
      const value = answers[step.key] || '';
      return `<div class="mx-auto mt-6 max-w-xl"><input id="active-input" class="quote-field text-center" type="${type}" name="${esc(step.key)}" value="${esc(value)}" placeholder="${esc(step.placeholder||'')}" inputmode="${esc(step.inputmode||'')}" autocomplete="${esc(step.autocomplete||'off')}"><p id="field-error" class="mt-2 min-h-5 text-center text-sm font-bold text-red-600"></p><button type="button" id="continue-button" class="quote-primary mt-2">Continue →</button></div>`;
    }
    function nameMarkup() {
      return `<div class="mx-auto mt-6 grid max-w-xl gap-3 sm:grid-cols-2"><input id="first-name" class="quote-field" autocomplete="given-name" placeholder="First name" value="${esc(answers.first_name||'')}"><input id="last-name" class="quote-field" autocomplete="family-name" placeholder="Last name" value="${esc(answers.last_name||'')}"><p id="field-error" class="min-h-5 text-sm font-bold text-red-600 sm:col-span-2"></p><button type="button" id="continue-button" class="quote-primary sm:col-span-2">Continue →</button></div>`;
    }
    function addressMarkup() {
      return `<div class="mx-auto mt-5 grid max-w-2xl grid-cols-2 gap-3"><input id="street" class="quote-field col-span-2" autocomplete="street-address" placeholder="Street address" value="${esc(answers.address||'')}"><input id="city" class="quote-field" autocomplete="address-level2" placeholder="City" value="${esc(answers.city||'')}"><select id="state" class="quote-field" autocomplete="address-level1"><option value="">State</option>${'AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC'.split(' ').map(s=>`<option ${answers.state===s?'selected':''}>${s}</option>`).join('')}</select><input id="address-zip" class="quote-field col-span-2" autocomplete="postal-code" inputmode="numeric" maxlength="5" placeholder="ZIP code" value="${esc(answers.zip||'')}"><p id="field-error" class="col-span-2 min-h-5 text-sm font-bold text-red-600"></p><button type="button" id="continue-button" class="quote-primary col-span-2">Continue →</button></div>`;
    }
    function reviewMarkup() {
      const vehicle = [answers.year, answers.make, answers.model].filter(Boolean).join(' ');
      const rows = [
        ['Vehicle',vehicle],['Insurance',answers.has_coverage==='Yes' ? answers.former_insurer : 'Not currently insured'],
        ['Driver',`${answers.first_name||''} ${answers.last_name||''}`.trim()],
        ['Address',[answers.address,answers.city,answers.state,answers.zip].filter(Boolean).join(', ')],
        ['Email',answers.email],['Phone',answers.phone]
      ];
      const consent = `By clicking “Review My Options,” I provide my electronic signature and agree that Idillo Inc., TeddyDrive, participating licensed insurance agents or providers, and the marketing partners identified in the linked disclosure may contact me at the phone number and email I provided about insurance products, including by calls or texts using automated technology or prerecorded messages, even if my number is on a Do Not Call list. Consent is not a condition of purchase. Message and data rates may apply.`;
      return `<div class="mx-auto mt-4 max-w-2xl"><div class="grid gap-x-5 rounded-2xl border border-slate-200 bg-slate-50 p-4 sm:grid-cols-2">${rows.map(([k,v])=>`<div class="border-b border-slate-200 py-2"><p class="text-xs font-black uppercase tracking-wide text-slate-400">${esc(k)}</p><p class="mt-0.5 font-extrabold text-slate-800">${esc(v||'Not provided')}</p></div>`).join('')}</div><label class="mt-3 flex cursor-pointer items-start gap-3 rounded-2xl border-2 border-slate-200 p-3"><input id="consent" type="checkbox" class="mt-1 h-5 w-5 shrink-0 accent-[#1777d4]"><span id="consent-copy" class="text-[10px] leading-4 text-slate-600">${consent} <a href="/terms.html" target="_blank" class="font-bold text-teddyBlue underline">Terms</a> and <a href="/privacy.html" target="_blank" class="font-bold text-teddyBlue underline">Privacy Policy</a>.</span></label><p id="field-error" class="mt-1 min-h-5 text-center text-sm font-bold text-red-600"></p><button type="submit" id="submit-button" class="quote-primary">Review My Options →</button></div>`;
    }

    function render() {
      const visible = activeSteps();
      if (index >= visible.length) index = visible.length - 1;
      const step = visible[index];
      const sectionOrder = ['vehicle','coverage','driver','contact'];
      const sectionIndex = sectionOrder.indexOf(step.section);
      const routePct = sectionIndex * (100 / (sectionOrder.length - 1));
      progressBar.style.width = routePct + '%';
      progressBar.parentElement.setAttribute('aria-valuenow', Math.round(routePct));
      routeCurrentLabel.textContent = `${step.section} ${String(sectionIndex + 1).padStart(2,'0')}`;
      routeSteps.forEach((routeStep, routeIndex) => {
        const dot = routeStep.querySelector('.route-dot');
        const label = routeStep.querySelector('.route-label');
        dot.style.backgroundColor = routeIndex === sectionIndex ? '#ff7300' : routeIndex < sectionIndex ? '#1777d4' : '#cbd5e1';
        label.style.color = routeIndex <= sectionIndex ? '#082e5f' : '#94a3b8';
      });
      stepCounter.textContent = index + 1;
      document.getElementById('step-total').textContent = visible.length;
      backButton.classList.toggle('invisible', index === 0);
      let body = '';
      if (step.type === 'choice') body = choiceMarkup(step);
      else if (step.type === 'logo') body = logoMarkup(step);
      else if (step.type === 'model') body = modelMarkup(step);
      else if (step.type === 'name') body = nameMarkup();
      else if (step.type === 'address') body = addressMarkup();
      else if (step.type === 'review') body = reviewMarkup();
      else if (step.type === 'select') body = `<div class="mx-auto mt-6 max-w-xl"><select id="active-input" class="quote-field text-center"><option value="">Select state</option>${step.options.map(value=>`<option ${answers[step.key]===value?'selected':''}>${value}</option>`).join('')}</select><p id="field-error" class="mt-2 min-h-5 text-center text-sm font-bold text-red-600"></p><button type="button" id="continue-button" class="quote-primary mt-2">Continue →</button></div>`;
      else body = fieldMarkup(step, step.type === 'phone' ? 'tel' : step.type);
      stage.innerHTML = heading(step) + body + (step.note ? `<p class="mt-3 text-center text-xs text-slate-400">${esc(step.note)}</p>` : '');
      bind(step);
      window.scrollTo({top:0,behavior:'smooth'});
    }

    function advance() { history.push(index); index++; render(); }
    function bind(step) {
      stage.querySelectorAll('[data-value]').forEach(button => button.addEventListener('click', () => {
        answers[step.key] = button.dataset.value;
        button.classList.add('selected');
        setTimeout(advance, 120);
      }));
      const yearSelect = document.getElementById('year-select');
      if (yearSelect) yearSelect.addEventListener('change', () => { if(yearSelect.value){ answers[step.key]=yearSelect.value; advance(); } });
      const continueButton = document.getElementById('continue-button');
      if (!continueButton) return;
      const submitCurrent = () => {
        let value = '';
        if (step.type === 'name') {
          answers.first_name = document.getElementById('first-name').value.trim();
          answers.last_name = document.getElementById('last-name').value.trim();
          if (!answers.first_name || !answers.last_name) return showError('Enter your first and last name.');
        } else if (step.type === 'address') {
          answers.address = document.getElementById('street').value.trim();
          answers.city = document.getElementById('city').value.trim();
          answers.state = document.getElementById('state').value;
          answers.zip = document.getElementById('address-zip').value.replace(/\D/g,'').slice(0,5);
          if (!answers.address || !answers.city || !answers.state || !/^\d{5}$/.test(answers.zip)) return showError('Enter your complete address and 5-digit ZIP code.');
        } else {
          const input = document.getElementById('active-input'); value = input.value.trim();
          if (step.type === 'phone') {
            const digits=value.replace(/\D/g,''); if(digits.length!==10) return showError('Enter a valid 10-digit phone number.');
            value=digits;
          } else if (step.type === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) return showError('Enter a valid email address.');
          else if (!value || (step.validate && !step.validate(value))) return showError(step.error || 'Complete this field to continue.');
          answers[step.key] = value;
        }
        advance();
      };
      continueButton.addEventListener('click', submitCurrent);
      stage.querySelectorAll('input').forEach(input => input.addEventListener('keydown', e => { if(e.key==='Enter'){e.preventDefault();submitCurrent();} }));
    }
    function showError(message) { const el=document.getElementById('field-error'); if(el) el.textContent=message; }

    backButton.addEventListener('click', () => { if(index>0){ index--; render(); } });
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const consent = document.getElementById('consent');
      if (!consent || !consent.checked) return showError('Please provide consent before continuing.');
      const button = document.getElementById('submit-button');
      button.disabled = true; button.textContent = 'Submitting…';
      document.getElementById('consent_timestamp').value = new Date().toISOString();
      document.getElementById('consent_text').value = document.getElementById('consent-copy').innerText;
      answers.consent_timestamp = document.getElementById('consent_timestamp').value;
      answers.consent_text = document.getElementById('consent_text').value;
      answers.xxTrustedFormCertUrl = document.getElementById('xxTrustedFormCertUrl').value;
      answers.Jornaya_LeadID = document.getElementById('Jornaya_LeadID').value;
      answers.page_url = location.href.split('?')[0];
      try {
        const response = await fetch(ENDPOINT,{
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify(answers)
        });
        const result = await response.json();
        if(!response.ok || !result.success) throw new Error(result.message || 'Submission failed');
        form.classList.add('hidden');
        document.getElementById('success-panel').classList.remove('hidden');
        document.getElementById('success-panel').classList.add('grid');
        progressBar.style.width='100%';
      } catch (error) {
        showError('We could not submit your request. Please try again.');
        button.disabled=false; button.textContent='Review My Options →';
      }
    });

    const params = new URLSearchParams(location.search);
    const allowedPrefill = ['year','make','model','has_coverage','former_insurer'];
    allowedPrefill.forEach(key => { if(params.get(key)) answers[key]=params.get(key).slice(0,100); });
    render();
  })();
  </script>
