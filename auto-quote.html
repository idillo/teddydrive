    *{box-sizing:border-box}html,body{margin:0;height:100%}body{font-family:Roboto,Arial,sans-serif;background:linear-gradient(145deg,#fff 0%,#fff 42%,#f2f8fd 100%);color:var(--ink);display:grid;grid-template-rows:64px minmax(0,1fr) 38px;height:100svh;overflow:hidden}button,input,select{font:inherit}

    main{min-height:0;width:100%;padding:16px 24px 10px;overflow:hidden}.progress-shell{max-width:980px;margin:0 auto 5px}.progress{height:7px;background:#e3edf6;border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;width:40%;border-radius:inherit;background:linear-gradient(90deg,var(--blue),#61aaf0);transition:width .35s ease}.back-wrap{max-width:980px;margin:0 auto;height:34px}.back{border:0;background:none;color:var(--blue);font-weight:700;cursor:pointer;padding:8px 0}.back:hover{color:var(--blue-dark);text-decoration:underline}

    .yn{display:flex;justify-content:center;gap:16px;margin-top:16px}.yn button{flex:1;max-width:410px;min-height:112px;border:2px solid var(--border);border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;gap:16px;cursor:pointer;font-size:23px;color:var(--navy);box-shadow:0 8px 24px rgba(8,46,95,.06);transition:border-color .16s,box-shadow .16s,transform .16s,background .16s}.yn button:hover,.choice:hover,.make:hover{transform:translateY(-2px)}.yn .yes:hover{border-color:var(--green);background:var(--green-soft);box-shadow:0 12px 28px rgba(85,173,104,.16)}.yn .no:hover{border-color:var(--red);background:var(--red-soft);box-shadow:0 12px 28px rgba(220,102,112,.14)}.circle{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:32px;font-weight:500;line-height:1}.yes .circle{background:var(--green)}.no .circle{background:var(--red)}
    .grid,.make-grid{display:grid;gap:9px;margin-top:12px;min-height:0;overflow:auto;padding:2px 4px 8px}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g7{grid-template-columns:repeat(7,1fr)}.g7 .choice{min-height:40px;padding:7px}.choice,.make{border:1.5px solid var(--border);border-radius:12px;background:#fff;min-height:52px;padding:11px 13px;color:var(--ink);cursor:pointer;font-weight:700;box-shadow:0 4px 12px rgba(8,46,95,.04);transition:.15s}.choice:hover,.make:hover{border-color:var(--blue);box-shadow:0 8px 20px rgba(23,119,212,.12)}.list-choice{display:flex;align-items:center;justify-content:center;text-align:center}.make-grid{grid-template-columns:repeat(5,1fr)}.make{min-height:91px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.make img{height:43px;width:86px;object-fit:contain}.make span{font-size:13px}
    .form{max-width:560px;width:100%;margin:12px auto 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:10px}.field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 5px}.field input,.field select{width:100%;border:1.5px solid var(--border);border-radius:11px;padding:13px 14px;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,119,212,.12)}.error{min-height:17px;color:#c83340;font-size:12px;margin-top:4px}.continue{width:100%;max-width:420px;margin:7px auto 0;display:block;border:0;border-radius:11px;background:var(--blue);color:#fff;padding:14px 24px;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 7px 18px rgba(23,119,212,.2)}.continue:hover{background:var(--blue-dark)}.continue:disabled{opacity:.55;cursor:wait}.consent{max-width:560px;margin:9px auto 0;border:1.5px solid var(--border);background:#f6fafd;border-radius:11px;padding:10px 13px;font-size:10px;line-height:1.42;color:#5a6b80}.consent a{color:var(--blue)}.status{text-align:center;padding:28px}.status-mark{width:66px;height:66px;border-radius:50%;background:#dcfce7;color:#15803d;display:grid;place-items:center;font-size:36px;margin:auto}
    footer{background:rgba(255,255,255,.94);border-top:1px solid #e3edf5;text-align:center;padding:10px 16px;font-size:11px;color:#788794}footer a{color:#657687;text-decoration:none;margin-left:10px}

    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>

  <script>
  (()=>{
    'use strict';
    const ENDPOINT='/api/auto-quote', card=document.getElementById('card'), back=document.getElementById('back'), fill=document.getElementById('progress-fill');
    const answers={}; let current=0, history=[], enteringOlderYear=false;
    try{Object.assign(answers,JSON.parse(sessionStorage.getItem('td_quote')||'{}'))}catch(e){}
    const esc=(s='')=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const logoBase='https://cdn.jsdelivr.net/gh/filippofilip95/car-logos-dataset@master/logos/optimized/';
    const makeNames=['Toyota','Ford','Chevrolet','Honda','Nissan','Hyundai','Kia','Jeep','Ram','GMC','Subaru','Dodge','Chrysler','Buick','Mazda','Volkswagen','Tesla','BMW','Mercedes-Benz','Lexus','Audi','Acura','Cadillac','Lincoln','Volvo','Infiniti','Mitsubishi','Genesis','Land Rover','Porsche','Mini','Jaguar','Alfa Romeo','Fiat','Pontiac','Saturn','Mercury','Hummer','Scion','Suzuki','Isuzu','Saab','Smart','Polestar','Rivian','Maserati','Other'];
    const logoSlug=n=>n.toLowerCase().replace(/ /g,'-');
    const models={
      Toyota:['RAV4','Corolla','Camry','Highlander','Tacoma','Prius','Tundra','Sienna','4Runner','Corolla Cross','Grand Highlander','Other'],Ford:['F-150','Escape','Explorer','Edge','Mustang','Bronco','Ranger','Expedition','Maverick','Bronco Sport','Other'],Chevrolet:['Silverado','Equinox','Traverse','Malibu','Trax','Blazer','Colorado','Tahoe','Suburban','Camaro','Other'],Honda:['CR-V','Civic','Accord','Pilot','HR-V','Odyssey','Ridgeline','Passport','Other'],Nissan:['Rogue','Altima','Sentra','Pathfinder','Frontier','Murano','Kicks','Armada','Other'],Hyundai:['Tucson','Elantra','Santa Fe','Sonata','Palisade','Kona','Venue','Santa Cruz','Ioniq 5','Other'],Kia:['Sorento','Sportage','Forte','Telluride','Soul','Carnival','EV6','K5','Seltos','Other'],Jeep:['Wrangler','Grand Cherokee','Cherokee','Compass','Gladiator','Renegade','Wagoneer','Other'],Ram:['1500','2500','3500','ProMaster','Other'],GMC:['Sierra','Yukon','Acadia','Terrain','Canyon','Hummer EV','Other'],Subaru:['Outback','Forester','Crosstrek','Impreza','Legacy','Ascent','WRX','Other'],Dodge:['Charger','Challenger','Durango','Journey','Grand Caravan','Other'],Chrysler:['300','Pacifica','Town & Country','200','Voyager','Other'],Buick:['Encore','Encore GX','Enclave','Envision','LaCrosse','Regal','Other'],Mazda:['CX-5','Mazda3','CX-9','CX-30','CX-50','Mazda6','MX-5 Miata','Other'],Volkswagen:['Jetta','Tiguan','Atlas','Passat','Golf','Taos','ID.4','Other'],Tesla:['Model 3','Model Y','Model S','Model X','Cybertruck','Other'],BMW:['3 Series','5 Series','X3','X5','X1','4 Series','X7','Other'],'Mercedes-Benz':['C-Class','E-Class','GLC','GLE','A-Class','S-Class','GLA','Other'],Lexus:['RX','ES','NX','IS','GX','UX','Other'],Audi:['A4','Q5','Q7','A6','Q3','A3','Other'],Acura:['MDX','RDX','TLX','ILX','Integra','Other'],Cadillac:['Escalade','XT5','CT5','XT4','CT4','XT6','Other'],Lincoln:['Navigator','Aviator','Nautilus','Corsair','MKZ','Other'],Volvo:['XC90','XC60','XC40','S60','S90','Other'],Infiniti:['Q50','QX60','QX80','Q60','QX50','Other'],Mitsubishi:['Outlander','Outlander Sport','Eclipse Cross','Mirage','Other'],Genesis:['G70','G80','GV70','GV80','Other'],'Land Rover':['Range Rover','Range Rover Sport','Range Rover Evoque','Discovery','Defender','Other'],Porsche:['Cayenne','Macan','911','Panamera','Taycan','Other'],Mini:['Cooper','Countryman','Clubman','Other'],Jaguar:['F-Pace','E-Pace','XF','XE','F-Type','Other'],'Alfa Romeo':['Giulia','Stelvio','4C','Giulietta','Tonale','Other'],Fiat:['500','500X','500L','124 Spider','500e','Panda','Other'],Pontiac:['G6','Grand Prix','Grand Am','Vibe','G8','G5','Sunfire','Bonneville','Torrent','Solstice','GTO','Aztek','Firebird','Montana','Other'],Saturn:['Vue','Ion','Aura','Outlook','SL','SC','Astra','Sky','Relay','L300','Other'],Mercury:['Grand Marquis','Mariner','Milan','Mountaineer','Sable','Marauder','Cougar','Monterey','Montego','Marquis','Other'],Hummer:['H2','H3','H3T','H1','Other'],Scion:['tC','xB','xD','iQ','FR-S','iA','iM','xA','Other'],Suzuki:['Grand Vitara','SX4','Kizashi','Forenza','XL7','Equator','Reno','Verona','Aerio','Vitara','Other'],Isuzu:['Ascender','Rodeo','Trooper','i-Series','Amigo','Axiom','Hombre','VehiCROSS','Other'],Saab:['9-3','9-5','9-7X','9-4X','9-2X','900','9000','Other'],Smart:['Fortwo','Forfour','Fortwo Electric Drive','Other'],Polestar:['Polestar 2','Polestar 1','Polestar 3','Polestar 4','Other'],Rivian:['R1T','R1S','Other'],Maserati:['Ghibli','Levante','Quattroporte','GranTurismo','GranCabrio','Grecale','MC20','Other'],Other:['Other']
    };
    const years=[...Array.from({length:28},(_,i)=>String(2027-i)),'Older'];
    const providers=['AAA / Auto Club','Allstate','Farm Bureau','Farmers','GEICO','Liberty Mutual','Nationwide','Progressive','State Farm','Travelers','USAA','Other'];
    const education=['Some/No High School','High School Diploma','GED','Some College','Associate Degree','Bachelors Degree','Masters Degree','Doctoral Degree','Trade/Vocational'];
    const occupations=['Administrative Clerical','Business Owner','Construction Trades','Disabled','Manager/Supervisor','Other Non-technical','Other Technical','Retail','Retired','Self Employed','Student','Unemployed'];
    const states='AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY DC'.split(' ');
    const steps=[
      {k:'has_coverage',s:0,t:'Are you currently insured?',type:'yn'},
      {k:'own_or_rent',s:0,t:'Do you own or rent your home?',type:'yn',o:['Own','Rent']},
      {k:'zip',s:0,t:'What is your ZIP code?',type:'zip'},
      {k:'year',s:0,t:"What's the year of your vehicle?",type:'years'},
      {k:'make',s:0,t:"What's the make of your vehicle?",type:'makes'},
      {k:'model',s:0,t:()=>`What's the model of your ${answers.make||'vehicle'}?`,type:'models'},
      {k:'owned_or_leased',s:0,t:()=>`Do you own or lease your ${vehicleName()}?`,type:'list',o:['Owned','Financed','Leased']},
      {k:'use',s:0,t:()=>`What is the primary use for your ${[answers.year,answers.make].filter(Boolean).join(' ')}?`,type:'list',o:['Commute','Pleasure','Business','Farm']},
      {k:'second_vehicle',s:0,t:'Would you like to add a second vehicle?',sub:'Save an additional 20%',type:'yn'},
      {k:'year_2',s:0,t:"What's the year of your second vehicle?",type:'years',when:a=>a.second_vehicle==='Yes'},
      {k:'make_2',s:0,t:"What's the make of your second vehicle?",type:'makes',when:a=>a.second_vehicle==='Yes'},
      {k:'model_2',s:0,t:()=>`What's the model of your ${answers.make_2||'second vehicle'}?`,type:'models',when:a=>a.second_vehicle==='Yes'},
      {k:'owned_or_leased_2',s:0,t:()=>`Do you own or lease your ${vehicleName('_2')}?`,type:'list',o:['Owned','Financed','Leased'],when:a=>a.second_vehicle==='Yes'},
      {k:'use_2',s:0,t:'What is the primary use for your second vehicle?',type:'list',o:['Commute','Pleasure','Business','Farm'],when:a=>a.second_vehicle==='Yes'},
      {k:'former_insurer',s:1,t:'Who is your current insurance provider?',type:'list',o:providers,when:a=>a.has_coverage==='Yes'},
      {k:'months_insured',s:1,t:'How long have you been continuously insured?',sub:'Five or more years may qualify you for better rates',type:'list',o:['Less than 1 year','1–2 years','3–4 years','5+ years'],when:a=>a.has_coverage==='Yes'},
      {k:'gender',s:2,t:'What is your gender?',type:'yn',o:['Male','Female'],neutral:true},
      {k:'marital_status',s:2,t:'What is your marital status?',type:'yn',o:['Married','Single'],neutral:true},
      {k:'highest_level',s:2,t:'What is your education level?',type:'grid',o:education},
      {k:'occupation',s:2,t:'What is your occupation?',type:'grid',o:occupations},
      {k:'credit_rating',s:2,t:'Estimate Your Credit Rating',sub:"Most people have a 'Good' or 'Excellent' rating",type:'grid',o:['Excellent','Good','Average','Poor or Fair']},
      {k:'license_status',s:2,t:'Do you have an active license?',type:'yn'},
      {k:'ticket_count',s:2,t:'How many tickets have you had in the past three (3) years?',type:'grid',o:['0','1','2','3+']},
      {k:'at_fault_accident',s:2,t:'Have you had an at-fault accident in the past (3) years?',type:'yn'},
      {k:'dui',s:2,t:'Have you had a DUI conviction in the past (3) years?',type:'yn'},
      {k:'birthdate',s:2,t:"What's your date of birth?",type:'dob'},
      {k:'military',s:2,t:'Have you or your spouse ever honorably served in the U.S. military?',type:'yn'},
      {k:'bundle_interest',s:2,t:'Would you like to bundle your auto and home insurance policies?',sub:'Drivers who bundle their policies save an average of 20%!',type:'yn',when:a=>a.own_or_rent==='Own'},
      {k:'name',s:3,t:'What is your name?',sub:'Personal Information is Safe & Secure',type:'name'},
      {k:'address',s:3,t:'What is your address?',type:'address'},
      {k:'email',s:3,t:"What's your email?",sub:'We take privacy seriously. No spam!',type:'email'},
      {k:'phone',s:3,t:'Your options are ready to review!',sub:'Enter your number so a participating licensed insurance agent or provider may contact you.',type:'phone'},
      {k:'review',s:3,t:'Review Your Information',type:'review'}
    ];
    function visible(){return steps.filter(x=>!x.when||x.when(answers))}function vehicleName(s=''){return [answers['year'+s],answers['make'+s],answers['model'+s]].filter(Boolean).join(' ')}
    function save(){try{sessionStorage.setItem('td_quote',JSON.stringify(answers))}catch(e){}}function title(x){return typeof x.t==='function'?x.t():x.t}
    function choice(v,cls='choice'){return `<button type="button" class="${cls}" data-value="${esc(v)}">${esc(v)}</button>`}
    function yn(x){const opts=x.o||['Yes','No'];if(x.neutral)return `<div class="yn">${opts.map(v=>choice(v,'choice')).join('')}</div>`;return `<div class="yn">${opts.map((v,i)=>`<button type="button" class="${i?'no':'yes'}" data-value="${esc(v)}"><span class="circle">${i?'×':'✓'}</span><strong>${esc(v)}</strong></button>`).join('')}</div>`}
    function renderBody(x){
      if(x.type==='yn')return yn(x);
      if(x.type==='years')return `<div class="grid g7">${years.map(v=>choice(v)).join('')}</div>`;
      if(x.type==='makes')return `<div class="make-grid">${makeNames.map(n=>`<button type="button" class="make" data-value="${esc(n)}">${n==='Other'?'<b style="font-size:25px;color:var(--blue)">•••</b>':`<img src="${logoBase+logoSlug(n)}.png" alt="${esc(n)}" loading="lazy" onerror="this.style.display='none'">`}<span>${esc(n)}</span></button>`).join('')}</div>`;
      if(x.type==='models'){const m=answers[x.k==='model_2'?'make_2':'make']||'Other';return `<div class="grid g1">${(models[m]||models.Other).map(v=>choice(v,'choice list-choice')).join('')}</div>`}
      if(x.type==='list')return `<div class="grid g1">${x.o.map(v=>choice(v,'choice list-choice')).join('')}</div>`;
      if(x.type==='grid')return `<div class="grid g2">${x.o.map(v=>choice(v)).join('')}</div>`;
      if(x.type==='zip')return formFields(`<div class="field"><label>ZIP Code</label><input id="zip-only" inputmode="numeric" pattern="[0-9]*" maxlength="5" autocomplete="postal-code" value="${esc(answers.zip||'')}"></div>`);
      if(x.type==='dob')return formFields(`<div class="field"><label>Date of Birth</label><input id="dob" inputmode="numeric" placeholder="MM/DD/YYYY" maxlength="10" value="${esc(answers.birthdateDisplay||'')}"></div>`);
      if(x.type==='name')return formFields(`<div class="row"><div class="field"><label>First Name</label><input id="first" autocomplete="given-name" value="${esc(answers.first_name||'')}"></div><div class="field"><label>Last Name</label><input id="last" autocomplete="family-name" value="${esc(answers.last_name||'')}"></div></div>`);
      if(x.type==='address')return formFields(`<div class="field"><label>Street Address</label><input id="street" autocomplete="street-address" value="${esc(answers.address||'')}"></div><div class="row"><div class="field"><label>City</label><input id="city" autocomplete="address-level2" value="${esc(answers.city||'')}"></div><div class="field"><label>State</label><select id="state"><option value="">Select</option>${states.map(s=>`<option ${answers.state===s?'selected':''}>${s}</option>`).join('')}</select></div></div>`);
      if(x.type==='email')return formFields(`<div class="field"><label>Email Address</label><input id="single" type="email" autocomplete="email" value="${esc(answers.email||'')}"></div>`);
      if(x.type==='phone')return formFields(`<div class="field"><label>Phone Number</label><input id="single" type="tel" inputmode="tel" autocomplete="tel" maxlength="14" value="${esc(answers.phone||'')}"></div><div class="consent" id="consent-copy">By clicking <strong>“See My Options,”</strong> I provide my express written consent for TeddyDrive.com, Idillo Inc., its <a href="/marketing-partners.html" target="_blank">marketing partners</a>, and participating licensed insurance agents or providers to contact me at the phone number and email I provided, including by telephone calls using automated technology or prerecorded messages, even if my number is on a Do Not Call registry. Consent is not a condition of purchase. I am at least 18 years old and agree to the <a href="/terms.html" target="_blank">Terms</a> and <a href="/privacy.html" target="_blank">Privacy Policy</a>.</div>`,'See My Options ›');
      if(x.type==='review')return review(); return '';
    }
    function formFields(inner,label='Continue ›'){return `<div class="form">${inner}<div id="error" class="error"></div><button type="button" id="continue" class="continue">${label}</button></div>`}
    function render(){enteringOlderYear=false;const v=visible();current=Math.max(0,Math.min(current,v.length-1));const x=v[current],pct=Math.round(40+((current/(v.length-1))*60));fill.style.width=pct+'%';fill.parentElement.setAttribute('aria-valuenow',pct);back.hidden=current===0;card.innerHTML=`<div class="question">${esc(title(x))}</div>${x.sub?`<div class="sub">${esc(x.sub)}</div>`:''}${renderBody(x)}`;bind(x);window.scrollTo({top:0,behavior:'smooth'})}
    function showOlderYear(x){enteringOlderYear=true;back.hidden=false;card.innerHTML=`<div class="question">What is the exact year of your ${x.k==='year_2'?'second vehicle':'vehicle'}?</div>${formFields(`<div class="field"><label>Vehicle Year</label><input id="older-year" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="Example: 1998"></div>`)}`;const submit=()=>{const value=(document.getElementById('older-year').value||'').replace(/\D/g,''),year=Number(value);if(!/^\d{4}$/.test(value)||year>=2000)return fail('Enter a valid four-digit vehicle year older than 2000.');answers[x.k]=value;save();history.push(current);current++;render()};document.getElementById('continue').onclick=submit;document.getElementById('older-year').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submit()}};document.getElementById('older-year').focus()}
    function bind(x){card.querySelectorAll('[data-value]').forEach(b=>b.onclick=()=>{if(x.type==='years'&&b.dataset.value==='Older'){showOlderYear(x);return}answers[x.k]=b.dataset.value;save();history.push(current);current++;render()});const c=document.getElementById('continue');if(c)c.onclick=()=>submitStep(x);card.querySelectorAll('input').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();submitStep(x)}})}
    function fail(m){const e=document.getElementById('error');if(e)e.textContent=m}
    function submitStep(x){
      if(x.type==='zip'){const v=document.getElementById('zip-only').value.replace(/\D/g,'');if(!/^\d{5}$/.test(v))return fail('Please enter a valid 5-digit ZIP code.');answers.zip=v}
      else if(x.type==='dob'){const v=document.getElementById('dob').value.trim(),m=v.match(/^(0[1-9]|1[0-2])\/(0[1-9]|[12]\d|3[01])\/(\d{4})$/);if(!m)return fail('Please enter a valid date (MM/DD/YYYY).');const d=new Date(+m[3],+m[1]-1,+m[2]),now=new Date();let age=now.getFullYear()-d.getFullYear();if(now<new Date(now.getFullYear(),d.getMonth(),d.getDate()))age--;if(age<18||age>110)return fail('Please enter a valid birthdate for a driver age 18 or older.');answers.birthdate=`${m[3]}-${m[1]}-${m[2]}`;answers.birthdateDisplay=v}
      else if(x.type==='name'){answers.first_name=document.getElementById('first').value.trim();answers.last_name=document.getElementById('last').value.trim();if(!answers.first_name||!answers.last_name)return fail('First and last name are required.')}
      else if(x.type==='address'){answers.address=document.getElementById('street').value.trim();answers.city=document.getElementById('city').value.trim();answers.state=document.getElementById('state').value;if(!answers.address||!answers.city||!answers.state)return fail('Enter your complete street address, city, and state.')}
      else if(x.type==='email'){const v=document.getElementById('single').value.trim();if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return fail('Please enter a valid email address.');answers.email=v}
      else if(x.type==='phone'){const raw=document.getElementById('single').value,d=raw.replace(/\D/g,'');if(d.length!==10)return fail('Please enter a valid 10-digit phone number.');answers.phone=d;answers.consent_timestamp=new Date().toISOString();answers.consent_text=document.getElementById('consent-copy').innerText;answers.xxTrustedFormCertUrl=document.getElementById('xxTrustedFormCertUrl').value;answers.Jornaya_LeadID=document.getElementById('Jornaya_LeadID').value;answers.page_url=location.href.split('?')[0]}
      save();history.push(current);current++;render()
    }
    function review(){const rows=[['Vehicle',vehicleName()],['Second vehicle',answers.second_vehicle==='Yes'?vehicleName('_2'):'No'],['Currently insured',answers.has_coverage],['Provider',answers.former_insurer],['Driver',[answers.first_name,answers.last_name].filter(Boolean).join(' ')],['Address',[answers.address,answers.city,answers.state,answers.zip].filter(Boolean).join(', ')],['Email',answers.email],['Phone',answers.phone]];return `<div class="review"><section><h2>Your information</h2>${rows.map(r=>`<div class="review-row"><span>${esc(r[0])}</span><strong>${esc(r[1]||'Not provided')}</strong></div>`).join('')}</section><div id="error" class="error"></div><button type="button" id="submit" class="continue">Submit My Request ›</button></div>`}
    async function send(){const b=document.getElementById('submit');b.disabled=true;b.textContent='Submitting…';try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(answers)}),j=await r.json();if(!r.ok||!j.success)throw new Error(j.message||'No match');card.innerHTML=`<div class="status"><div class="status-mark">✓</div><div class="question">Your request is on its way</div><p>A participating licensed insurance agent or provider may contact you about available coverage options.</p></div>`;fill.style.width='100%';back.hidden=true}catch(e){fail(e.message||'We could not submit your request. Please try again.');b.disabled=false;b.textContent='Submit My Request ›'}}
    back.onclick=()=>{if(enteringOlderYear){render();return}if(current>0){current--;render()}};card.addEventListener('click',e=>{if(e.target.closest('#submit'))send()});
    const params=new URLSearchParams(location.search),prefill={fname:'first_name',firstname:'first_name',lname:'last_name',lastname:'last_name',email:'email',phone:'phone',zip:'zip',address:'address',city:'city',state:'state',dob:'birthdate',year:'year',make:'make',model:'model',ownership:'owned_or_leased',use:'use',insured:'has_coverage',provider:'former_insurer',gender:'gender',marital:'marital_status',education:'highest_level',occupation:'occupation',credit:'credit_rating',tickets:'ticket_count',license:'license_status',accident:'at_fault_accident',dui:'dui',homeownership:'own_or_rent',bundle:'bundle_interest',military:'military',second_vehicle:'second_vehicle',year2:'year_2',make2:'make_2',model2:'model_2'};
    Object.entries(prefill).forEach(([p,k])=>{if(params.get(p))answers[k]=params.get(p).slice(0,150)});
    if([...params.keys()].some(k=>prefill[k])){const v=visible(),done=x=>x.type==='name'?answers.first_name&&answers.last_name:x.type==='address'?answers.address&&answers.city&&answers.state&&answers.zip:x.type==='review'?false:Boolean(answers[x.k]);const first=v.findIndex(x=>!done(x));current=first<0?v.length-1:first}
    render();
  })();
  </script>
