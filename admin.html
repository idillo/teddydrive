<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TeddyDrive Admin</title><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#11243c;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#082e5f;color:white;padding:18px 4vw;display:flex;justify-content:space-between;align-items:center}main{max-width:1400px;margin:24px auto;padding:0 24px}.card{background:white;border:1px solid #dce4ef;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 4px 18px #17365d0c}button,input,select{font:inherit;border:1px solid #bcc9d9;border-radius:8px;padding:9px 11px}button{cursor:pointer;background:#0c63ce;color:white;border:0}.secondary{background:#e7eef8;color:#123}.danger{background:#a82424}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1}.hidden{display:none!important}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px;border-bottom:1px solid #e4eaf1;vertical-align:top}th{color:#53657b}.badge{padding:3px 8px;border-radius:999px;background:#e7eef8;font-size:12px}.error{color:#a82424}.muted{color:#66778d}.buyer{display:grid;grid-template-columns:1.2fr repeat(3,minmax(120px,1fr));gap:10px;margin:12px 0;padding:14px;border:1px solid #dce4ef;border-radius:10px}.buyer .wide{grid-column:1/-1}.buyer label{display:grid;gap:5px;color:#53657b;font-size:12px;font-weight:700}.buyer label input,.buyer label select{color:#11243c;font-size:16px;font-weight:400;width:100%}.modal{position:fixed;inset:0;background:#00152ea8;padding:5vh 5vw;overflow:auto}.modal>.card{max-width:1100px;margin:auto}pre{white-space:pre-wrap;word-break:break-word;background:#f4f7fb;padding:12px;border-radius:8px}@media(max-width:800px){.buyer{grid-template-columns:1fr}th:nth-child(4),td:nth-child(4){display:none}}
</style></head><body>
<header><strong>TeddyDrive Admin</strong><button id="logout" class="secondary hidden">Sign out</button></header>
<main><section id="login" class="card" style="max-width:440px;margin:12vh auto"><h1>Admin sign in</h1><p class="muted">Enter your administrator credentials.</p><form id="loginForm"><p><input id="email" type="email" autocomplete="username" placeholder="Email" required style="width:100%"></p><p><input id="password" type="password" autocomplete="current-password" placeholder="Password" required style="width:100%"></p><button>Sign in</button><p id="loginError" class="error"></p></form></section>
<div id="app" class="hidden"><section class="card"><div class="row"><h1 class="grow">Leads</h1><button id="export">Export CSV</button></div><div class="row"><input id="search" class="grow" placeholder="Search name, email, phone, or lead ID"><select id="status"><option value="">All statuses</option><option>pending</option><option>accepted</option><option>failed</option><option>no_buyers</option></select><input id="from" type="date"><input id="to" type="date"><button id="filter">Filter</button></div><p id="leadError" class="error"></p><div style="overflow:auto"><table><thead><tr><th>Created</th><th>Lead</th><th>Contact</th><th>Location</th><th>Status</th><th></th></tr></thead><tbody id="leads"></tbody></table></div></section>
<section class="card"><div class="row"><h2 class="grow">Buyer routing</h2><input id="newBuyerName" placeholder="New buyer name"><button id="addBuyer">Add buyer</button></div><p class="muted">Save a buyer draft, then publish that buyer only. Other unfinished buyer drafts remain unpublished.</p><p id="routingStatus"></p><div id="buyers"></div></section></div></main>
<div id="detailModal" class="modal hidden"><section class="card"><div class="row"><h2 class="grow">Lead details</h2><button id="closeDetail" class="secondary">Close</button></div><div id="detail"></div></section></div>
<script>
(()=>{'use strict';let config,token=localStorage.getItem('td_admin_token')||'';const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(action,options={}){const sep=action.includes('?')?'&':'?';const r=await fetch('/api/admin?action='+action,{...options,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token,...options.headers}});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Request failed');return r}
async function init(){config=await fetch('/api/admin?action=config').then(r=>r.json());if(token){try{await showApp()}catch{signOut()}}}
async function signIn(e){e.preventDefault();$('loginError').textContent='';try{const r=await fetch(config.supabaseUrl+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:config.publishableKey,'Content-Type':'application/json'},body:JSON.stringify({email:$('email').value,password:$('password').value})});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Sign in failed');token=j.access_token;localStorage.setItem('td_admin_token',token);await showApp()}catch(e){$('loginError').textContent=e.message}}
function signOut(){token='';localStorage.removeItem('td_admin_token');$('app').classList.add('hidden');$('logout').classList.add('hidden');$('login').classList.remove('hidden')}
async function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');await Promise.all([loadLeads(),loadBuyers(),loadRoutingStatus()])}
async function loadRoutingStatus(){const status=$('routingStatus');try{const data=await api('routing-status').then(r=>r.json());if(data.error){status.className='error';status.textContent='Runtime routing error: '+data.error}else{status.className='';status.textContent='Runtime routing active: '+data.buyers.map(b=>`${b.name} (${b.environment}, ${b.delivery_mode})`).join(', ')}}catch(e){status.className='error';status.textContent=e.message}}
async function loadLeads(){try{$('leadError').textContent='';const q=new URLSearchParams({search:$('search').value,status:$('status').value,from:$('from').value,to:$('to').value});const rows=await api('leads&'+q).then(r=>r.json());$('leads').innerHTML=rows.map(x=>`<tr><td>${esc(new Date(x.created_at).toLocaleString())}</td><td><b>${esc(x.first_name)} ${esc(x.last_name)}</b><br><small>${esc(x.id)}</small></td><td>${esc(x.email)}<br>${esc(x.phone)}</td><td>${esc(x.state)} ${esc(x.zip)}</td><td><span class="badge">${esc(x.delivery_status)}</span>${x.routing_error?`<br><small class="error">${esc(x.routing_error)}</small>`:''}</td><td><button data-lead="${esc(x.id)}">Details</button></td></tr>`).join('')||'<tr><td colspan="6">No leads found.</td></tr>';$('leads').querySelectorAll('[data-lead]').forEach(b=>b.onclick=()=>detail(b.dataset.lead))}catch(e){$('leadError').textContent=e.message}}
async function detail(id){const d=await api('lead&id='+encodeURIComponent(id)).then(r=>r.json());$('detail').innerHTML=`<h3>${esc(d.lead.first_name)} ${esc(d.lead.last_name)}</h3><pre>${esc(JSON.stringify(d.lead,null,2))}</pre><h3>Buyer attempts</h3>${d.attempts.map(a=>`<div class="card"><div class="row"><b class="grow">${esc(a.buyers?.campaign_name||a.buyers?.name||a.buyer_id)}${a.buyers?.campaign_id?` (${esc(a.buyers.campaign_id)})`:''} — ${esc(a.stage)}</b><span class="badge">${esc(a.status)}</span><button data-retry="${esc(a.buyer_id)}">Retry</button></div><p>Price: ${esc(a.price||'—')} · HTTP: ${esc(a.http_status||'—')} · ${esc(a.latency_ms||'—')} ms</p>${a.error?`<p class="error">${esc(a.error)}</p>`:''}<pre>${esc(JSON.stringify(a.response_payload,null,2))}</pre></div>`).join('')||'<p>No attempts.</p>'}`;$('detail').querySelectorAll('[data-retry]').forEach(b=>b.onclick=async()=>{if(!confirm('Retry this lead with this buyer?'))return;await api('retry',{method:'POST',body:JSON.stringify({lead_id:id,buyer_id:b.dataset.retry})});await detail(id)});$('detailModal').classList.remove('hidden')}
async function loadBuyers(){
  const rows=await api('buyers').then(r=>r.json());
  $('buyers').innerHTML=rows.map(b=>`<div class="buyer" data-id="${esc(b.id)}">
    <label>Buyer name<input name="name" value="${esc(b.name)}"></label>
    <label>Campaign name<input name="campaign_name" value="${esc(b.campaign_name)}"></label>
    <label>Campaign ID<input name="campaign_id" value="${esc(b.campaign_id)}"></label>
    <label>Delivery mode<select name="delivery_mode"><option value="off" ${b.delivery_mode==='off'?'selected':''}>Off</option><option value="direct_post" ${b.delivery_mode==='direct_post'?'selected':''}>Direct post</option><option value="ping_post" ${b.delivery_mode==='ping_post'?'selected':''}>Ping/post</option></select></label>
    <label>Environment<select name="environment"><option value="test" ${b.environment==='test'?'selected':''}>Test</option><option value="production" ${b.environment==='production'?'selected':''}>Production</option></select></label>
    <label>Priority (lower launches first)<input name="priority" type="number" value="${esc(b.priority)}"></label>
    <label class="wide">Direct-post endpoint<input name="direct_endpoint_url" value="${esc(b.direct_endpoint_url)}"></label>
    <label class="wide">Ping endpoint<input name="ping_endpoint_url" value="${esc(b.ping_endpoint_url)}"></label>
    <label class="wide">Post endpoint<input name="post_endpoint_url" value="${esc(b.post_endpoint_url)}"></label>
    <label>Credential variable name<input name="auth_env_var" value="${esc(b.auth_env_var)}"></label>
    <label>New API token (blank keeps current)<input name="api_token" type="password" autocomplete="new-password"></label>
    <label>Authorization scheme<input name="auth_scheme" value="${esc(b.auth_scheme)}"></label>
    <label>Adapter<select name="adapter"><option value="raw_json" ${b.adapter==='raw_json'?'selected':''}>Raw JSON</option><option value="jangl_auto" ${b.adapter==='jangl_auto'?'selected':''}>Jangl auto</option><option value="leadportal_ipr" ${b.adapter==='leadportal_ipr'?'selected':''}>LeadPortal IPR</option></select></label>
    <label class="leadportal-only">LeadPortal TYPE<input name="lead_type" value="${esc(b.lead_type)}"></label>
    <label class="leadportal-only">LeadPortal SRC<input name="source_code" value="${esc(b.source_code)}"></label>
    <label class="leadportal-only">Terminating phone (10 digits)<input name="terminating_phone" value="${esc(b.terminating_phone)}"></label>
    <label>Timeout (milliseconds)<input name="timeout_ms" type="number" value="${esc(b.timeout_ms)}"></label>
    <div class="wide row"><button data-save>Save draft</button><button data-test class="secondary">Send synthetic test</button><button data-publish class="danger">Publish this buyer &amp; deploy</button><span class="message"></span></div>
    <pre class="wide test-result hidden" aria-live="polite"></pre>
  </div>`).join('');
  document.querySelectorAll('.buyer').forEach(el=>{
    const value=n=>el.querySelector(`[name="${n}"]`).value;
    const testButton=el.querySelector('[data-test]'), message=el.querySelector('.message');
    const syncAdapterFields=()=>{
      const adapter=value('adapter');
      el.querySelectorAll('.leadportal-only').forEach(field=>field.classList.toggle('hidden',adapter!=='leadportal_ipr'));
      if(adapter==='jangl_auto'){
        const host=value('environment')==='production'?'https://api.jangl.com':'https://test-api.jangl.com';
        el.querySelector('[name="direct_endpoint_url"]').value=host+'/v2/auto_insurance/direct_post';
        el.querySelector('[name="ping_endpoint_url"]').value=host+'/v2/auto_insurance/ping';
        el.querySelector('[name="post_endpoint_url"]').value=host+'/v2/auto_insurance/post';
      }
    };
    const updateTestControl=()=>{
      const isOff=value('delivery_mode')==='off', isTest=value('environment')==='test';
      testButton.disabled=isOff||!isTest;
      testButton.title=isOff?'Select Direct Post or Ping/Post and save first.':(!isTest?'Synthetic tests require the Test environment.':'');
      if(isOff) message.textContent='Select Direct Post or Ping/Post and save first.';
      else if(message.textContent==='Select Direct Post or Ping/Post and save first.') message.textContent='';
    };
    el.querySelector('[name="delivery_mode"]').onchange=updateTestControl;
    el.querySelector('[name="environment"]').onchange=()=>{updateTestControl();syncAdapterFields()};
    el.querySelector('[name="adapter"]').onchange=syncAdapterFields;
    updateTestControl(); syncAdapterFields();
    el.querySelector('[data-save]').onclick=async()=>{
      const data={id:el.dataset.id};
      ['name','campaign_name','campaign_id','delivery_mode','environment','priority','direct_endpoint_url','ping_endpoint_url','post_endpoint_url','auth_env_var','api_token','auth_scheme','adapter','lead_type','source_code','terminating_phone','timeout_ms'].forEach(n=>data[n]=value(n));
      try { await api('buyer',{method:'PATCH',body:JSON.stringify(data)}); el.querySelector('[name="api_token"]').value=''; el.querySelector('.message').textContent='Draft saved'; }
      catch(e) { el.querySelector('.message').textContent=e.message; el.querySelector('.message').className='message error'; }
    };
    el.querySelector('[data-publish]').onclick=async()=>{
      const summary=`Buyer: ${value('name')}\nEnvironment: ${value('environment')}\nDelivery mode: ${value('delivery_mode')}\n\nPublish ONLY this buyer's saved draft and start a deployment?`;
      if(!confirm(summary))return;
      message.className='message'; message.textContent='Publishing this buyer…';
      try { await api('publish-buyer',{method:'POST',body:JSON.stringify({buyer_id:el.dataset.id})}); message.textContent='This buyer was published. Deployment started. Refresh after Vercel is Ready to verify Runtime routing.'; }
      catch(e) { message.className='message error'; message.textContent=e.message; }
    };
    testButton.onclick=async()=>{
      if(!confirm('Send synthetic data to this TEST buyer?'))return;
      const output=el.querySelector('.test-result'); output.classList.remove('hidden'); output.textContent='Sending test…';
      try { const result=await api('test',{method:'POST',body:JSON.stringify({buyer_id:el.dataset.id})}).then(r=>r.json()); output.textContent=JSON.stringify(result,null,2); }
      catch(e) { output.textContent=`TEST ERROR\n${e.message}`; output.classList.add('error'); }
    };
  });
}
$('loginForm').onsubmit=signIn;$('logout').onclick=signOut;$('filter').onclick=loadLeads;$('closeDetail').onclick=()=>$('detailModal').classList.add('hidden');$('addBuyer').onclick=async()=>{const name=$('newBuyerName').value.trim();if(!name)return;await api('buyer',{method:'POST',body:JSON.stringify({name})});$('newBuyerName').value='';await loadBuyers()};$('export').onclick=async()=>{const q=new URLSearchParams({search:$('search').value,status:$('status').value,from:$('from').value,to:$('to').value});const blob=await api('export&'+q).then(r=>r.blob()),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='teddydrive-leads.csv';a.click();URL.revokeObjectURL(a.href)};init()})();
</script></body></html>
